spring.application.name=tradetree
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.config.import=optional:file:.env[.properties]


spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.admin.bootstrap.username=${DEMO_ADMIN_USERNAME:}
app.admin.bootstrap.password=${DEMO_ADMIN_PASSWORD:}