<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | Login</title>
    <script src="https://kit.fontawesome.com/efba67cbe9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="layout-index">
        <header class="site-header">
            <div class="header-content">
                <a class="site-logo" href="index.html"><img src="images/logo.png" class="site-image"> TradeTree</a>
            </div>
            <div class="header-content">
                <nav>
                    <ul>
                        <li><a href="marketplace.html">Marketplace</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="login.html">Log in</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
            <section class="login-panel">
                <h2 id="sign-in-header">Sign In</h2>
                <form action="#" method="post">
                    <div>
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username">
                    </div>

                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                    </div>

                    <button type="submit">Sign In</button>
                </form>

                <p>If you do not have a profile, create one below.</p>
                <button type="button" id="open-create-profile">Create a Profile</button>
            </section>

            <section class="sign-up-panel">
                <div id="create-profile-modal" hidden="true">
                    <div role="dialog">
                        <h3 id="create-profile-title">Create a Profile</h3>
                        <form action="#" method="post">
                            <div>
                                <label for="new-username">Username</label>
                                <input type="text" id="new-username" name="new-username"
                                    placeholder="Choose a username">
                            </div>

                            <div>
                                <label for="new-password">Password</label>
                                <input type="password" id="new-password" name="new-password"
                                    placeholder="Choose a password">
                            </div>

                            <button type="submit">Create Profile</button>
                            <button type="button" id="close-create-profile">Cancel</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>



        <footer class="site-footer">
            <p>&copy; 2026 TradeTree</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
