<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | Conversations</title>
    <script src="https://kit.fontawesome.com/efba67cbe9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="site-brand" aria-label="TradeTree home">
                <span class="brand-mark" aria-hidden="true"></span>
                <a class="site-logo" href="index.html">TradeTree</a>
            </div>
            <nav aria-label="Main navigation">
                <a href="marketplace.html">Marketplace</a>
                <a href="about.html">About</a>
                <a href="login.html">Log in</a>
            </nav>
        </header>

        <main class="page-shell">
            <aside class="left-sidebar" aria-label="Messages sidebar">
                <div class="messages-list">
                    <div class="sidebar-title">Messages</div>
                    <a href="messages.html" class="message-user active">user1</a>
                    <a href="messages.html" class="message-user">user2</a>
                    <a href="messages.html" class="message-user">user3</a>
                    <a href="messages.html" class="message-user">user4</a>
                </div>

                <div class="sidebar-settings">
                    <a href="#">Settings</a>
                </div>
            </aside>

            <section class="content-panel" aria-label="All conversations">
                <div class="search-header">
                    <h1>Messages</h1>
                    <div class="search-bar">
                        <search aria-label="Search conversations">
                            <input type="search" name="conversation-search" id="conversation-search" aria-label="Search conversations input">
                        </search>
                    </div>
                </div>

                <div class="conversation-list">
                    <a href="messages.html" class="conversation-item">
                        <span class="conversation-user">user1</span>
                    </a>
                    <a href="messages.html" class="conversation-item">
                        <span class="conversation-user">user2</span>
                    </a>
                    <a href="messages.html" class="conversation-item">
                        <span class="conversation-user">user3</span>
                    </a>
                    <a href="messages.html" class="conversation-item">
                        <span class="conversation-user">user4</span>
                    </a>
                </div>
            </section>
        </main>

        <footer class="site-footer">
        <p>&copy; 2026 TradeTree</p>
    </footer>
    </div>
</body>

</html>
