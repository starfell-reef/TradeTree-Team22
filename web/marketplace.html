<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | Marketplace</title>
    <script src="https://kit.fontawesome.com/efba67cbe9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="site-brand" aria-label="TradeTree home">
                <span class="brand-mark" aria-hidden="true"></span>
                <a class="site-logo" href="index.html">TradeTree</a>
            </div>
            <nav aria-label="Main navigation">
                <a href="marketplace.html">Marketplace</a>
                <a href="about.html">About</a>
                <a href="login.html">Log in</a>
            </nav>
        </header>

        <main class="page-shell">
            <aside class="left-sidebar" aria-label="Profile sidebar">
                <div class="profile-block">
                    <div class="profile-avatar" aria-hidden="true"></div>
                    <div class="display-name">display name</div>
                    <div class="username">@username</div>
                </div>

                <nav class="sidebar-nav" aria-label="Sidebar navigation">
                    <a href="new-listing.html">New listing</a>
                    <a href="#">Your listings</a>
                    <a href="marketplace.html">Marketplace</a>
                    <a href="#">Following</a>
                    <a href="conversations.html">Messages</a>
                    <a href="myReports.html">My Reports</a>
                    <a href="adminMarketplace.html">Admins</a>
                </nav>

                <div class="sidebar-settings">
                    <a href="#">Settings</a>
                </div>
            </aside>

            <section class="content-panel" aria-label="Marketplace listings">
                <div class="search-header">
                    <h1>Search Listings</h1>
                    <div class="search-bar">
                        <search aria-label="Search listings">
                            <input type="search" name="listing-search" id="listing-search" aria-label="Search listings input">
                        </search>
                    </div>

                    <div class="zip-search-bar">
                        <label for="zip-search">Zip code</label>
                        <input type="text" id="zip-search" name="zip-search" inputmode="numeric" pattern="[0-9]*" placeholder="Enter ZIP code" aria-label="Search by ZIP code">
                    </div>
                </div>

                <div class="listing-grid">
                    <article class="listing-card featured-listing" id="listing1">
                        <div class="listing-layout">
                            <img id="listing-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZbz3rpFrQ1CQ1SfQfR58uA9haTvR7uP0qdZi5fJKGZQ&s=10" alt="Listing image">
                            <div class="listing-links">
                                <a href="profile.html" id="username" role="button">@user</a>
                                <button id="user-rating" type="button" aria-label="User rating">
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-regular fa-star"></i>
                                </button>
                                <a href="messages.html" id="message-user" role="button">Message</a>
                            </div>
                        </div>
                    </article>

                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                </div>
            </section>
        </main>

        <footer class="site-footer">
        <p>&copy; 2026 TradeTree</p>
    </footer>
    </div>
</body>

</html>
