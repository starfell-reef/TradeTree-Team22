<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | Listing</title>
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="site-brand" aria-label="TradeTree home">
                <span class="brand-mark" aria-hidden="true"></span>
                <a class="site-logo" href="index.html">TradeTree</a>
            </div>
            <nav aria-label="Main navigation">
                <a href="marketplace.html">Marketplace</a>
                <a href="about.html">About</a>
                <a href="login.html">Log in</a>
            </nav>
        </header>

        <main class="page-shell">
            <aside class="left-sidebar" aria-label="Profile sidebar">
                <div class="profile-block">
                    <div class="profile-avatar" aria-hidden="true"></div>
                    <div class="display-name">listing user</div>
                    <div class="username">@username</div>
                </div>

                <nav class="sidebar-nav" aria-label="Sidebar navigation">
                    <a href="new-listing.html">New listing</a>
                    <a href="#">Your listings</a>
                    <a href="marketplace.html">Marketplace</a>
                    <a href="#">Following</a>
                    <a href="conversations.html">Messages</a>
                </nav>

                <div class="sidebar-settings">
                    <a href="#">Settings</a>
                </div>
            </aside>

            <section class="content-panel" aria-label="Listing details">
                <div class="search-header">
                    <h1>Search Listings</h1>
                    <div class="search-bar">
                        <search aria-label="Search listings">
                            <input type="search" name="listing-search" id="listing-search" aria-label="Search listings input">
                        </search>
                    </div>
                </div>

                <div class="listing-gallery" aria-label="Listing gallery">
                    <article class="gallery-image" aria-label="Item image one"></article>
                    <article class="gallery-image" aria-label="Item image two"></article>
                    <article class="gallery-image" aria-label="Item image three"></article>
                </div>

                <div class="listing-detail-box">
                    <div class="listing-title">Listing title</div>
                </div>

                <div class="listing-description-box">
                    <div class="listing-description">Listing description</div>
                </div>

                <button type="button" class="message-button">Message</button>
            </section>
        </main>

        <footer class="site-footer">
        <p>&copy; 2026 TradeTree</p>
    </footer>
    </div>
</body>

</html>
