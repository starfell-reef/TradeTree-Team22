<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | New Listing</title>
    <script src="https://kit.fontawesome.com/efba67cbe9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="header-content">
                <a class="site-logo" href="index.html"><img src="images/logo.png" class="site-image"> TradeTree</a>
            </div>
            <div class="header-content">
                <nav>
                    <ul>
                        <li><a href="marketplace.html">Marketplace</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="login.html">Log in</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <aside class="left-sidebar">
            <div class="sidebar-section" id="profile">
                <div class="profile-avatar"><img src="images/logo.png"></div>
                <div class="display-name">display name</div>
                <div class="username">@username</div>
                <hr>
            </div>

            <div class="sidebar-section">
                <nav>
                    <ul>
                        <li><a href="new-listing.html">New listing</a></li>
                        <li><a href="#">Your listings</a></li>
                        <li>
                            <hr>
                        </li>
                        <li><a href="marketplace.html">Marketplace</a></li>
                        <li><a href="#">Following</a></li>
                        <li><a href="messages.html">Messages</a></li>
                        <li>
                            <hr>
                        </li>
                        <li><a href="myReports.html">My Reports</a></li>
                        <li><a href="adminMarketplace.html">Admins</a></li>
                    </ul>
                </nav>
            </div>

            <div class="sidebar-section">
                <nav>
                    <ul>
                        <li><a href="#">Settings</a></li>
                    </ul>
                </nav>
            </div>
        </aside>

        <main class="content">
            <section>
                <div class="form-header">
                    <h1>New Listing</h1>
                </div>

                <form class="new-listing-form" action="marketplace.html" method="post">
                    <div class="image-upload-area">
                        <label for="listing-images">Add images of the item</label>
                        <input type="file" id="listing-images" name="listing-images" multiple accept="image/*">
                    </div>

                    <div class="description-area">
                        <label for="listing-description">Description</label>
                        <textarea id="listing-description" name="listing-description" rows="10"
                            placeholder="Describe the item you want to list"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="list-it">List it</button>
                        <a href="marketplace.html" class="cancel-button">Cancel</a>
                    </div>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 TradeTree</p>
        </footer>
    </div>
</body>

</html>
