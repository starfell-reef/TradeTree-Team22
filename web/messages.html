<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | Messages</title>
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="site-brand" aria-label="TradeTree home">
                <span class="brand-mark" aria-hidden="true"></span>
                <a class="site-logo" href="index.html">TradeTree</a>
            </div>
            <nav aria-label="Main navigation">
                <a href="marketplace.html">Marketplace</a>
                <a href="about.html">About</a>
                <a href="login.html">Log in</a>
            </nav>
        </header>

        <main class="page-shell">
            <aside class="left-sidebar" aria-label="Messages sidebar">
                <div class="messages-list">
                    <div class="sidebar-title">Messages</div>
                    <a href="conversations.html" class="message-user active">user1</a>
                    <a href="conversations.html" class="message-user">user2</a>
                    <a href="conversations.html" class="message-user">user3</a>
                    <a href="conversations.html" class="message-user">user4</a>
                </div>

                <div class="sidebar-settings">
                    <a href="#">Settings</a>
                </div>
            </aside>

            <section class="content-panel" aria-label="Message thread">
                <div class="chat-header">
                    <a href="listing.html" class="chat-user" aria-label="Open listing">@user1 private message</a>
                    <a href="listing.html" class="chat-image-link" aria-label="Open original posting">
                        <span class="chat-image" aria-hidden="true"></span>
                    </a>
                </div>

                <div class="chat-thread" aria-label="Message thread content">
                    <div class="message incoming">
                        <div class="message-bubble">Hello! Is this still available?</div>
                    </div>

                    <div class="message outgoing">
                        <div class="message-bubble">Yes, it is available. Would you like to trade?</div>
                    </div>

                    <div class="message incoming">
                        <div class="message-bubble">Yes, I'm interested in your item.</div>
                    </div>
                </div>

                <form class="chat-input-area" action="#" method="post">
                    <label for="message-text" class="sr-only">Message here</label>
                    <input type="text" id="message-text" name="message-text" placeholder="Message here">
                    <button type="submit">Send</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
        <p>&copy; 2026 TradeTree</p>
    </footer>
    </div>
</body>

</html>
