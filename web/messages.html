<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | Messages</title>
    <script src="https://kit.fontawesome.com/efba67cbe9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="header-content">
                <a class="site-logo" href="index.html"><img src="images/logo.png" class="site-image"> TradeTree</a>
            </div>
            <div class="header-content">
                <nav>
                    <ul>
                        <li><a href="marketplace.html">Marketplace</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="login.html">Log in</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <aside class="left-sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Messages</div>
                <ul class="messages-list">
                    <li><a href="conversations.html" class="message-user-btn active">user1</a></li>
                    <li><a href="conversations.html" class="message-user-btn">user2</a></li>
                    <li><a href="conversations.html" class="message-user-btn">user3</a></li>
                    <li><a href="conversations.html" class="message-user-btn">user4</a></li>
                </ul>
            </div>

            <div class="sidebar-settings">
                <a href="#">Settings</a>
            </div>
        </aside>

        <main class="content">
            <section>
                <div class="chat-header">
                    <a href="listing.html" class="chat-user" aria-label="Open listing">@user1 private message</a>
                    <a href="listing.html" class="chat-image-link" aria-label="Open original posting">
                        <span class="chat-image" aria-hidden="true"></span>
                    </a>
                </div>
            </section> 

            <section>
                <div class="chat-thread">
                    <div class="message incoming">
                        <div class="message-bubble">Hello! Is this still available?</div>
                    </div>

                    <div class="message outgoing">
                        <div class="message-bubble">Yes, it is available. Would you like to trade?</div>
                    </div>

                    <div class="message incoming">
                        <div class="message-bubble">Yes, I'm interested in your item.</div>
                    </div>
                </div>

                <form class="chat-input-area" action="#" method="post">
                    <input type="text" id="message-text" name="message-text" placeholder="Message here">
                    <button type="submit" class="sendbtn">Send</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 TradeTree</p>
        </footer>
    </div>
</body>

</html>
