<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | Admin Profile</title>
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="site-brand" aria-label="TradeTree home">
                <span class="brand-mark" aria-hidden="true"></span>
                <a class="site-logo" href="index.html">TradeTree</a>
            </div>
            <nav aria-label="Main navigation">
                <a href="adminMarketplace.html">Marketplace</a>
                <a href="about.html">About</a>
                <a href="login.html">Log in</a>
                <a href="profile.html">User View</a>
            </nav>
        </header>

        <main class="page-shell">
            <aside class="left-sidebar" aria-label="Admin profile sidebar">
                <div class="profile-block">
                    <div class="profile-avatar" aria-hidden="true"></div>
                    <div class="listing-user">admin profile</div>
                    <div class="username">@admin</div>
                </div>

                <div class="profile-meta">
                    <div class="meta-row">Star rating</div>
                    <div class="meta-row">Trader Reviews</div>
                </div>

                <nav class="sidebar-nav" aria-label="Sidebar navigation">
                    <a href="marketplace.html">Marketplace</a>
                    <a href="#">Following</a>
                    <a href="conversations.html">Messages</a>
                    <a href="tickets.html">Tickets</a>
                </nav>

                <div class="sidebar-settings">
                    <a href="#">Settings</a>
                </div>
            </aside>

            <section class="content-panel" aria-label="Admin profile listings">
                <div class="search-header">
                    <h1>Search @admin's listings</h1>
                    <div class="search-bar">
                        <search aria-label="Search admin listings">
                            <input type="search" name="admin-search" id="admin-search" aria-label="Search admin listings input">
                        </search>
                    </div>
                </div>

                <div class="listing-grid">
                    <article class="listing-card featured-listing" id="listing1">
                        <div class="listing-layout">
                            <img id="listing-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZbz3rpFrQ1CQ1SfQfR58uA9haTvR7uP0qdZi5fJKGZQ&s=10" alt="Listing image">
                            <div class="listing-links">
                                <button type="button" id="username">@admin</button>
                                <button type="button" id="message-user">Message</button>
                            </div>
                        </div>
                    </article>

                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                    <article class="listing-card" aria-label="Listing placeholder"></article>
                </div>
            </section>
        </main>

        <footer class="site-footer">
        <p>&copy; 2026 TradeTree</p>
