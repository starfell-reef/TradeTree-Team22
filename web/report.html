<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeTree | Report Listing</title>
</head>

<body>
    <div class="layout">
        <header class="site-header">
            <div class="site-brand" aria-label="TradeTree home">
                <span class="brand-mark" aria-hidden="true"></span>
                <a class="site-logo" href="index.html">TradeTree</a>
            </div>
            <nav aria-label="Main navigation">
                <a href="marketplace.html">Marketplace</a>
                <a href="about.html">About</a>
                <a href="login.html">Log in</a>
            </nav>
        </header>

        <main class="page-shell">
            <aside class="left-sidebar" aria-label="Profile sidebar">
                <div class="profile-block">
                    <div class="profile-avatar" aria-hidden="true"></div>
                    <div class="display-name">display name</div>
                    <div class="username">@username</div>
                </div>

                <nav class="sidebar-nav" aria-label="Sidebar navigation">
                    <a href="new-listing.html">New listing</a>
                    <a href="#">Your listings</a>
                    <a href="marketplace.html">Marketplace</a>
                    <a href="#">Following</a>
                    <a href="conversations.html">Messages</a>
                </nav>

                <div class="sidebar-settings">
                    <a href="#">Settings</a>
                </div>
            </aside>

            <section class="content-panel" aria-label="Report listing">
                <div class="report-header">
                    <h1>Report Listing</h1>
                </div>

                <form class="report-form" action="tickets.html" method="post">
                    <div>
                        <label for="report-title">Title</label>
                        <input type="text" id="report-title" name="report-title" placeholder="Short title for this report">
                    </div>

                    <div>
                        <label for="report-reason">Reason</label>
                        <textarea id="report-reason" name="report-reason" rows="8" placeholder="Explain why this listing should be reviewed"></textarea>
                    </div>

                    <button type="submit">Submit Report</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
        <p>&copy; 2026 TradeTree</p>
    </footer>
    </div>
</body>

</html>
